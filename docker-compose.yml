version: "3.9"

services:
  app:
    build: .
    container_name: app
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app/logs
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - TZ=Asia/Kolkata

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  worker:
    build: .
    container_name: worker
    command:  npx ts-node -r tsconfig-paths/register src/bullmq/runAllWorkers.ts
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - TZ=Asia/Kolkata  

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Kolkata

volumes:
  pgdata:
