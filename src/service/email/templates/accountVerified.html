<html>
    <head>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }
            .email-container {
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
                background-color: #ffffff;
            }
            .email-header {
                text-align: center;
                background-color: #f4f4f4;
                padding: 10px;
            }
            .email-body {
                padding: 20px;
            }
            .cta-button {
                display: inline-block;
                padding: 10px 20px;
                background-color: #28a745;
                color: #ffffff;
                text-decoration: none;
                border-radius: 5px;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <div class="email-container">
            <div class="email-header">
                <h1>Your Account is Now Verified!</h1>
            </div>
            <div class="email-body">
                <p>Dear {name},</p>
                <p>Congratulations! Your account has been successfully verified. You can now access all the features of the Anushtan.</p>
                <p>If you did not request this verification, please contact support immediately.</p>
                <a href="{supportLink}" class="cta-button">Contact Support</a>
            </div>
        </div>
    </body>
</html>
